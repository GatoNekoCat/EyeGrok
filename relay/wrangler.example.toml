# Copy this file to wrangler.toml. wrangler.toml is gitignored.
# Replace REPLACE_ME with the id printed by: npx wrangler kv namespace create REPLIES
# Do not put WRITE_KEY, READ_KEY, account ids, or real hostnames in this file.
# Keys are created in the shell and piped to `wrangler secret put`. They are never written here.

name = "eyegrok-relay"
main = "src/index.js"
compatibility_date = "2026-10-13"
workers_dev = true

[[kv_namespaces]]
binding = "REPLIES"
id = "REPLACE_ME"
preview_id = "REPLACE_ME"

# PAIR_KEY is a secret. Generate it in the shell and pipe it to `npx wrangler secret put PAIR_KEY`.
# It must be at least 32 characters and different from WRITE_KEY and READ_KEY.
# PAIR_TTL_SECONDS is optional. The Worker clamps it to 60..300. Default 300. Tests set 60.
# PAIR_TTL_SECONDS = "300"
# The Workers Rate Limiting binding is not configured here. Free-plan availability was not confirmed
# (Cloudflare documents the binding syntax, not that the free plan includes it). The Worker uses an
# in-memory per-isolate miss limiter instead.
